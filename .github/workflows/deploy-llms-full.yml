name: Generate and Update LLMS Catalog

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run extraction script
        run: python build_llms_full.py

      - name: Commit and push updated llms-full.txt
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add llms-full.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "chmod: auto-update llms-full.txt catalog [skip ci]" && git push)
